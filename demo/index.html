<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>deploy-map demo</title>
    <!-- Stands in for a host site that already has Bootstrap 5.3. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../dist/deploy-map.css">
    <script src="../dist/deploy-map.js"></script>
  </head>
  <body class="container py-3">
    <h1>deploy-map demo</h1>
    <!-- Demo-only control, outside the widget: it changes an option on the mounted widget. -->
    <div class="d-flex align-items-center gap-2 mb-3">
      <span id="match-label">Points that do not match the filters are</span>
      <div class="btn-group btn-group-sm" role="group" aria-labelledby="match-label">
        <input type="radio" class="btn-check" name="match" id="match-hide" value="hide" checked>
        <label class="btn btn-outline-secondary" for="match-hide">hidden</label>
        <input type="radio" class="btn-check" name="match" id="match-dim" value="dim">
        <label class="btn btn-outline-secondary" for="match-dim">dimmed</label>
      </div>
    </div>
    <div id="map" style="height: 600px"></div>
    <script>
      // Only `data` is required. Without `table`, every plain property becomes a column.
      const widget = DeployMap.mount('#map', {
        data: 'registry.json',
        filters: [{ property: 'type', label: 'Radar type' }, 'country'],
        style: { colorBy: 'type' },
        onFilterchange: (state) => console.log('filterchange', state),
        onViewchange: (view) => console.log('viewchange', view),
        table: {
          columns: [
            { property: 'radar_id', label: 'Code' },
            'type',
            'country',
            'location',
            'start',
            'end',
          ],
        },
      })
      for (const radio of document.querySelectorAll('input[name=match]')) {
        radio.addEventListener('change', () => widget.update({ matchBehaviour: radio.value }))
      }
    </script>
  </body>
</html>
