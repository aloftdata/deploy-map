name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      # The demo page loads ../dist, so the site keeps the repository layout.
      # The root only redirects to the demo.
      - name: Assemble demo site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp -r demo dist _site/
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=demo/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'

  # Publishes the demo to GitHub Pages, only from main and only after the checks pass.
  deploy-demo:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
